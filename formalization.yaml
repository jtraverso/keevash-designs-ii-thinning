fidelity:
  divergences: >-
    (a) Probability space: independent uniform permutations (as in PALOMAR-2026-11-17-000009);
    the activation probability is k/N_act. (b) Lemma e|E is stated in the space conditioned on
    the values of the colours at the fixed vertices U (the paper conditions on the local event
    E), for copies whose revealed values are F-linearly independent (non-degenerate colours);
    the error δ = (q²+q|U|)/N replaces the paper's c. (c) The thinning statement is proved for
    arbitrary families C_i of copies of pairwise distinct colours in an arbitrarily conditioned
    space (the paper's families are the copies through the edges of φ, conditioned on E^{e'}
    and on the colours T_e); the thinning coins are abstract independent coordinates whose
    events have the exact probabilities ∏(1 − w_i q_i) (hypothesis hθ), and μ_i q_i = t is
    assumed exactly (the paper has q_e = 1/G^{t_e}_{ψ_e} and μ_e ≈ zρG^{t_e}_{ψ_e}). The
    hypothesis hθ can be met when the q_i are rational (one coin coordinate per pattern w, a
    uniform permutation of [D] read at a fixed position with threshold D·∏(1 − w_i q_i), D a
    common denominator), which covers the paper's q_e = 1/G; for irrational q_i it cannot be
    met and the statement is then vacuous. (d) No
    asymptotic statement is made: the right-hand sides are explicit; they are small when the
    covering masses and errMax are small, which in the paper's regime is the case.

