version: "v0.4"

project:
  name: "Keevash, The existence of designs II: Lemma e|E (two-sided) and the thinning probability of the nibble"
  description: >-
    A Lean 4 / Mathlib formalization of two probabilistic estimates in the random algebraic
    template of P. Keevash, "The existence of designs II" (arXiv:1802.05900), as explicit
    finite-N inequalities. (1) DesignsII.TParams.lemma_e_E (Lemma 3.6 e|E with Remark 3.7(i),
    two-sided): in the template space conditioned on the values of the colours at a set U of
    fixed vertices, a copy φ meeting U in at most r−1 vertices, whose revealed values are
    F-linearly independent, passes the tests of colour j with probability between
    (1−δ)ρ₀(k) and ρ₀(k)/(1−δ), where δ = (q²+q|U|)/N < 1 and
    ρ₀(k) = N^(r−q) z^(−C(q,r)) ((q−r)!/q!)^C(q,r) |𝒜|^(−1) k/N_act. (2)
    DesignsII.TParams.thinning_probability (the computation of P(φ ∈ Φ') in the proof of
    Lemma 3.9 nibble): for families C_i (i < m) of copies of pairwise distinct colours, with
    covering masses μ_i = ∑_{x∈C_i} P(x passes) ≤ 1, thinning parameters q_i ∈ [0,1] with
    μ_i q_i = t for all i, and independent thinning coins whose event for the covering pattern
    w has probability ∏_i (1 − w_i q_i), the probability that the realised covering pattern's
    coin succeeds is (1−t)^m up to 2^m((∑_i μ_i)² + (m+1)·errMax), where errMax is an explicit
    maximum, over subsets of the families, of second-order terms (pairs of copies within a
    family and copies of different families sharing an edge). Both statements are finite-N
    inequalities valid for all permitted parameters; no asymptotic claim is part of the
    statements. Mathlib does not contain these results.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05B05", "60C05"]

repository:
  role: "substantive-development"

sources:
  - title: "The existence of designs II"
    authors:
      - "Peter Keevash"
    id: "arXiv:1802.05900"
    type: "paper"
    location: "arXiv:1802.05900v1: Section 3.3 (Lemma 3.6 e|E, Remark 3.7(i)) and the proof of Lemma 3.9 (nibble), the computation of P(φ ∈ Φ' | E^{e'} ∩ C)"
    relationship: "formalizes"
    note: >-
      The template is modelled as in the registered entry PALOMAR-2026-11-17-000009 (independent
      uniform permutations). The paper states Lemma e|E with a (1 ± c) error and derives the
      thinning probability "by repeated application of Remark 3.7(i)"; here both are proved
      with explicit errors: the joint covering of several edges with distinct colours is
      estimated by Bonferroni inequalities (copies of distinct colours sharing an edge cannot
      both pass; edge-disjoint groups are independent), and patterns with uncovered edges by
      Bonferroni inequalities for complements. The formalization is by a different author; the
      article's author was not involved.
    license: "all rights reserved"
    author_endorsement: "not-contacted"

